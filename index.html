<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lake Mendota Buoy Data</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>

<body>
  <header id="controls">
    <div class="title-row">
      <h1>Lake Mendota Buoy</h1>
      <span id="loadStatus" class="status"></span>
    </div>

    <div class="range-row">
      <label>Range:
        <input type="date" id="startDate">
        &ndash;
        <input type="date" id="endDate">
      </label>
      <div class="presets">
        <button data-days="7">7d</button>
        <button data-days="30">30d</button>
        <button data-days="90">90d</button>
        <button data-days="all">All</button>
      </div>
      <span id="binNote" class="bin-note"></span>
    </div>

    <div class="varToggles" id="varToggles"></div>
  </header>

  <main id="charts"></main>

  <footer>
    <p>Click and drag any plot to change the time range (synced across all plots).</p>
  </footer>

  <script src="app.js"></script>
</body>

</html>
